name: Plugin tools

on:
  pull_request:
    paths:
      - 'packages/plugin-tools/**'
      - '.github/workflows/plugin-tools.yml'
      - '.github/workflows/plugin-conformance.yml'
      - '.github/workflows/plugin-candidate-upload.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'cli.py'
      - 'openstudio_si/**'
      - 'tests/test_plugin_tooling_workflows.py'
      - 'docs/design/plugin-manifest-v0.1.schema.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build distribution and install wheel
        run: |
          python -m pip install build==1.3.0 pytest tomli
          python -m build --outdir "$RUNNER_TEMP/dist"
          python -m pip install "$(find "$RUNNER_TEMP/dist" -name '*.whl')[plugin-dev]"
      - name: Check repository-owned workflow contracts
        run: python -I -m pytest tests/test_plugin_tooling_workflows.py -c packages/plugin-tools/pyproject.toml --confcutdir=tests -q
      - name: Extract the source distribution independently
        run: |
          python - <<'PY'
          import os, pathlib, tarfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          with tarfile.open(next((root / 'dist').glob('*.tar.gz'))) as archive:
              for member in archive.getmembers():
                  if member.issym() or member.islnk() or pathlib.PurePosixPath(member.name).is_absolute() or '..' in pathlib.PurePosixPath(member.name).parts:
                      raise ValueError('Unsafe source archive member')
              archive.extractall(root / 'sdist-test')
          PY
      - name: Run standalone source-archive tests against the wheel
        working-directory: ${{ runner.temp }}
        run: |
          source_dir=$(find "$RUNNER_TEMP/sdist-test" -mindepth 1 -maxdepth 1 -type d)
          python -I -m pytest "$source_dir/packages/plugin-tools/tests" --confcutdir="$source_dir/packages/plugin-tools/tests" -q
      - name: Test installed package outside checkout
        working-directory: ${{ runner.temp }}
        run: python -I -m pytest "$GITHUB_WORKSPACE/packages/plugin-tools/tests" --confcutdir="$GITHUB_WORKSPACE/packages/plugin-tools/tests" -q
      - uses: actions/setup-node@v4
        if: matrix.python == '3.13'
        with:
          node-version: '22'
      - name: Install pinned host loaders
        if: matrix.python == '3.13'
        run: |
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/hosts" @anthropic-ai/claude-code@2.1.309 @openai/codex@0.169.0-alpha.11.1 semver@7.7.2
          echo "$RUNNER_TEMP/hosts/node_modules/.bin" >> "$GITHUB_PATH"
          openstudio-si plugin prepare-hosts "$RUNNER_TEMP/hosts" --output-dir "$RUNNER_TEMP/host-bin"
          echo "$RUNNER_TEMP/host-bin" >> "$GITHUB_PATH"
      - name: Check npm range parity and real host loading
        if: matrix.python == '3.13'
        env:
          NODE_PATH: ${{ runner.temp }}/hosts/node_modules
        working-directory: ${{ runner.temp }}
        run: python -I "$GITHUB_WORKSPACE/packages/plugin-tools/tests/validate_hosts.py"

  released-core-doctor:
    name: Released core 0.4.2 doctor isolation
    runs-on: ubuntu-latest
    env:
      CORE_BASELINE_URL: https://files.pythonhosted.org/packages/5b/cf/2d3e0922b0cd4b7a70e5760cfb8a2032cbe594a9247f1b8498f92380a265/openstudio_si-0.4.2-py3-none-any.whl
      CORE_BASELINE_SHA256: c81b9bae11269c4c09f4bb4c9b538934888e234abf5b5ac7d3b41d02d3c4caa0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Obtain pinned released baseline
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, urllib.request
          url, expected = os.environ['CORE_BASELINE_URL'], os.environ['CORE_BASELINE_SHA256']
          if not url.startswith('https://') or len(expected) != 64:
              raise SystemExit('PR A gate pending: configure the released 0.4.2 wheel URL and SHA-256 repository variables. No checkout fallback is allowed.')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'openstudio_si-0.4.2-py3-none-any.whl'
          urllib.request.urlretrieve(url, path)
          assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, 'Baseline hash mismatch'
          PY
      - name: Install current tooling for the controller (baseline gets its own venv)
        run: python -m pip install ".[plugin-dev]"
      - name: Compare released doctor with third-party plugins present
        run: python -I packages/plugin-tools/tests/check_released_core_doctor.py --core-wheel "$RUNNER_TEMP/openstudio_si-0.4.2-py3-none-any.whl" --sha256 "$CORE_BASELINE_SHA256" --report "$RUNNER_TEMP/released-core-doctor.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: released-core-doctor
          path: ${{ runner.temp }}/released-core-doctor.json
          if-no-files-found: warn
