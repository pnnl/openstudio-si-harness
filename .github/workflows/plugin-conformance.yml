name: Shared plugin conformance
on:
  workflow_call:
    inputs:
      tooling-version:
        required: true
        type: string
      package-release:
        default: false
        type: boolean
      release-tag:
        default: ''
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Require an exact published tooling version
        env:
          TOOLING_VERSION: ${{ inputs.tooling-version }}
        run: '[[ "$TOOLING_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: project
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install published developer tools
        env:
          TOOLING_VERSION: ${{ inputs.tooling-version }}
        run: |
          python -m venv "$RUNNER_TEMP/si-tooling"
          "$RUNNER_TEMP/si-tooling/bin/python" -m pip install --index-url https://pypi.org/simple --only-binary=:all: "openstudio-si[plugin-dev]==$TOOLING_VERSION"
          echo "$RUNNER_TEMP/si-tooling/bin" >> "$GITHUB_PATH"
      - name: Verify installed tooling command support
        env:
          TOOLING_VERSION: ${{ inputs.tooling-version }}
        run: |
          python -I - <<'PYTHON'
          import importlib.metadata as metadata
          import os, pathlib, subprocess, sys
          version = metadata.version("openstudio-si")
          if version != os.environ["TOOLING_VERSION"] or tuple(map(int, version.split("."))) < (0, 4, 3):
              raise SystemExit("Plugin CI requires the selected openstudio-si>=0.4.3 release.")
          command = pathlib.Path(sys.executable).with_name("openstudio-si")
          for action in ("prepare-hosts", "check-project", "export", "check-hosts", "package-release"):
              result = subprocess.run([str(command), "plugin", action, "--help"], capture_output=True, text=True, check=False)
              if result.returncode:
                  raise SystemExit(f"Installed openstudio-si {version} lacks required plugin command: {action}\n{result.stderr}")
          PYTHON
      - name: Install host CLIs without lifecycle scripts
        run: |
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/hosts" @anthropic-ai/claude-code@2.1.309 @openai/codex@0.169.0-alpha.11.1
          echo "$RUNNER_TEMP/hosts/node_modules/.bin" >> "$GITHUB_PATH"
          openstudio-si plugin prepare-hosts "$RUNNER_TEMP/hosts" --output-dir "$RUNNER_TEMP/host-bin"
          echo "$RUNNER_TEMP/host-bin" >> "$GITHUB_PATH"
      - name: Validate tracked source and export
        working-directory: project
        run: |
          openstudio-si plugin check-project . --require-tracked
          mkdir -p dist
          openstudio-si plugin export ./plugin --output ./dist/plugin > dist/export-report.json
          openstudio-si plugin check-hosts dist/export-report.json
      - name: Build marketplace candidate
        if: inputs.package-release
        working-directory: project
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: openstudio-si plugin package-release . --report dist/export-report.json --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.package-release
        with:
          name: marketplace-candidate
          path: project/dist/release/
          if-no-files-found: error
